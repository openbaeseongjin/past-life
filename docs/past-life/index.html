<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한 영혼의 여정</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@dgreenheck/ez-tree": "https://cdn.jsdelivr.net/npm/@dgreenheck/ez-tree@1.1.0/build/ez-tree.es.js"
} }</script>
<style>
/* 색 토큰 (화면 다시 기획 5장): 밤·종이·잉크·금·흔적 푸름. HUD 는 이 토큰과 그 투명 변형만 쓴다 */
:root{--night:#121329;--paper:#f6efe2;--ink:#1d2140;--gold:#e2b65e;--gold2:#a8770a;--trace:#2a6894;--glass:rgba(18,19,41,.55);
  /* 투명 변형·종이 그늘 (위 토큰에서 나온 것) */
  --glass-deep:rgba(18,19,41,.78);--veil:rgba(18,19,41,.5);--night-fade:rgba(18,19,41,.42);--shadow:rgba(8,8,24,.38);
  --paper2:#eadcbf;--paper-hi:rgba(255,252,244,.72);--paper-dim:rgba(246,239,226,.72);--paper-faint:rgba(246,239,226,.16);--paper-line:rgba(246,239,226,.3);
  --gold-line:rgba(226,182,94,.38);--gold-glow:rgba(226,182,94,.55);--ink-soft:rgba(29,33,64,.66);--ink-line:rgba(168,119,10,.32);
  --bead-hi:rgba(255,253,240,.9);--trace-l:#8ec3ea;
  /* 상태 넷 아이콘 색 (몸·살림·곁·마음)과 오름·내림 */
  --c-health:#ef8f8f;--c-wealth:#e2c48a;--c-family:#9cc3ee;--c-happy:#f2c14e;
  --k-health:#b9504f;--k-wealth:#8a6326;--k-family:#3d679e;--k-happy:#a8770a;
  --up:#2f7d55;--down:#b4493f;--up-hud:#a6e6b8;--down-hud:#ffa596;
  /* 시대의 바람 띠의 밀랍 도장 (사건 있는 해 = 붉은 밀랍, 조용한 해 = 금 밀랍) */
  --seal:#9e2f2a;--seal-hi:#d77066;--seal-lo:#5e1717;
  /* 서류·시작 화면 (작업 6 이 다시 그린다) */
  --bg:#eceef4;--card:#fbfbfd;--muted:#5d6280;--line:#d7dae6;--trace-bg:#dbe9f4;
  --serif:'Gowun Batang','Batang','AppleMyungjo',serif;--ui:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.6 var(--ui);word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow:hidden}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;min-height:36px}
button:focus-visible,textarea:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;min-height:44px}
button.quiet{background:transparent;border-color:currentColor;opacity:.85}
button.link{border:none;background:none;color:var(--muted);text-decoration:underline;justify-self:center}
[hidden]{display:none!important}
h3{margin:0 0 8px;font-size:15px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--trace-bg);color:var(--trace);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1em;height:1em;flex:none;display:block}

/* ── 해가 흐르는 화면: 섬 마을이 화면 가득, 가장자리에 HUD ── */
#app{--pad:16px;--top:calc(var(--pad) + env(safe-area-inset-top,0px));--left:calc(var(--pad) + env(safe-area-inset-left,0px));--right:calc(var(--pad) + env(safe-area-inset-right,0px));--bot:env(safe-area-inset-bottom,0px);color:var(--paper)}
:where(#app) button{min-height:0;font:inherit;color:inherit}   /* :where: 아래 HUD 단추 규칙이 이기게 (특정도 0) */
.stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,var(--ink),var(--night))}
#c{width:100%;height:100%;display:block}
.no3d{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--paper-dim);font:15px/1.7 var(--serif)}
/* 왼쪽 위: 영혼 배지 · 흔적 구슬 · 상태 넷 */
.hud-who{position:fixed;z-index:3;top:var(--top);left:var(--left);width:284px;padding:12px 14px 12px 12px;background:var(--glass);border:1px solid var(--gold-line);border-radius:20px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px var(--shadow);transition:opacity .3s}
.soulbadge{display:grid;grid-template-columns:56px 1fr;column-gap:12px;align-items:center}
.medal{grid-row:1/4;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--paper);font-size:28px;
  background:radial-gradient(circle at 50% 38%,var(--ink),var(--night));border:2px solid var(--gold);box-shadow:0 0 0 3px var(--glass-deep),0 0 20px var(--gold-glow)}
.medal .ic{filter:drop-shadow(0 0 6px var(--gold-glow))}
.lifen{font:600 12px/1.2 var(--ui);color:var(--gold);letter-spacing:.04em}
.agebox{display:flex;align-items:baseline;gap:5px;line-height:1}
#age{font:700 38px/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--paper);text-shadow:0 2px 10px var(--shadow)}
.agebox span{font:15px var(--serif);color:var(--paper-dim)}
.when{font-size:12px;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--paper-line);padding-top:3px;margin-top:4px}
.traces{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:11px;color:var(--paper-dim)}
.traces:empty{display:none}
.tb{width:15px;height:15px;padding:0;border:none;border-radius:50%;cursor:help;
  background:radial-gradient(circle at 34% 30%,var(--bead-hi) 0 16%,transparent 42%),radial-gradient(circle at 50% 58%,var(--trace-l),var(--trace) 72%,var(--ink));box-shadow:0 0 8px var(--trace-l)}
/* 흔적 구슬 옆 짙음 표시 ●○○ (모닥불에서 푸른 메아리를 꿸 때마다 한 칸) */
.tri{display:inline-flex;align-items:center;gap:4px;margin-left:2px}
.tlv{display:inline-flex;gap:3px}
.tlv i{width:6px;height:6px;border-radius:50%;background:var(--paper-faint);box-shadow:inset 0 0 0 1px var(--trace-l)}
.tlv i.on{background:var(--trace-l);box-shadow:0 0 5px var(--trace-l)}
.tri.deep .tb{box-shadow:0 0 12px var(--trace-l),0 0 0 1.5px var(--trace-l)}
.traces.pulse .tri.deep .tb,.traces.pulse .tri.deep .tlv i.on{animation:tracePulse 1.4s ease-out}
@keyframes tracePulse{0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(1)}}
#toast.echo{background:var(--trace);box-shadow:0 0 0 1.5px var(--trace-l),0 0 18px var(--trace-l);font:600 14px/1.5 var(--ui)}
/* 수치 판 (sim2 설계 5.1, 시안 s9): 건강·재산·곁·마음 = 숫자 · 막대 · 구체적인 한 줄 / 능력치 넷 / 신분 */
.board{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--gold-line);display:grid;gap:8px}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.stats li{position:relative;display:grid;grid-template-columns:22px auto auto minmax(0,1fr);grid-template-areas:"ic lbl num bar" "ic cl cl cl";column-gap:7px;row-gap:1px;align-items:center}
.stats li .ic{grid-area:ic;align-self:start;margin-top:1px;font-size:20px;filter:drop-shadow(0 1px 2px var(--shadow))}
.stats li[data-k="health"] .ic{color:var(--c-health)} .stats li[data-k="wealth"] .ic{color:var(--c-wealth)}
.stats li[data-k="family"] .ic{color:var(--c-family)} .stats li[data-k="happy"] .ic{color:var(--c-happy)}
.stats .lbl{grid-area:lbl;font:600 13px/1.3 var(--ui);color:var(--paper);white-space:nowrap}
.stats .num{grid-area:num;min-width:2ch;font:700 15px/1.3 var(--ui);font-variant-numeric:tabular-nums;color:var(--paper)}
.stats .bar{grid-area:bar;height:6px;border-radius:3px;background:var(--paper-faint);box-shadow:inset 0 0 0 1px var(--paper-line);overflow:hidden}
.stats .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--c-health);transition:width .5s ease-out}
.stats li[data-k="wealth"] .bar i{background:var(--c-wealth)} .stats li[data-k="family"] .bar i{background:var(--c-family)} .stats li[data-k="happy"] .bar i{background:var(--c-happy)}
.stats .cl{grid-area:cl;min-height:1.35em;font-size:11.5px;line-height:1.35;color:var(--paper-dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 6px;padding-top:8px;border-top:1px solid var(--paper-line)}
.at{position:relative;display:grid;grid-template-columns:15px minmax(0,1fr);grid-template-areas:"al al" "ic num" "lit lit";column-gap:4px;align-items:center;min-width:0}
.at .ic{grid-area:ic;font-size:14px;color:var(--gold)}
.at .al{grid-area:al;font-size:11px;line-height:1.3;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at .num{grid-area:num;font:700 15px/1.25 var(--ui);font-variant-numeric:tabular-nums;color:var(--paper)}
.at .lit{grid-area:lit;justify-self:start;margin-top:1px;padding:0 6px;border-radius:999px;font-size:10.5px;line-height:1.6;white-space:nowrap;color:var(--paper-dim);box-shadow:inset 0 0 0 1px var(--paper-line)}
.at .lit.on{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}
.status{position:relative;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px;padding-top:8px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--paper-dim)}
.status .ic{align-self:center;font-size:16px;color:var(--gold)}
.status .sl{font-size:11px}
.status .sv{font:700 14px/1.3 var(--ui);color:var(--paper)}
.status .sb{color:var(--down-hud);font-weight:600}
.status .ss{margin-left:auto;font-size:11px}
/* 숫자가 바뀌면: 잠깐 빛나고 옆에 +3 · −2 가 떠올랐다 사라진다 */
.num.glow{animation:numGlow 1.2s ease-out}
@keyframes numGlow{0%{color:var(--paper)}20%{color:var(--gold);text-shadow:0 0 10px var(--gold-glow),0 0 2px var(--gold)}100%{color:var(--paper);text-shadow:none}}
.delta{position:absolute;font:700 14px/1 var(--ui);font-style:normal;white-space:nowrap;text-shadow:0 0 8px currentColor,0 1px 2px var(--night);pointer-events:none;animation:rise 1.1s ease-out forwards}
.delta.up{color:var(--up-hud)} .delta.down{color:var(--down-hud)}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1;transform:translateY(-4px)}100%{opacity:0;transform:translateY(-18px)}}
/* 위 가운데: 시대의 바람 띠 (설계 3.3). 왼쪽 판과 해시계 사이 빈자리의 가운데. 누르면 아래에 그해 맥락 카드 */
.windbar{position:fixed;z-index:6;top:var(--top);left:50%;transform:translateX(-50%);width:min(480px,calc(100vw - 760px));display:flex;justify-content:center;pointer-events:none;transition:opacity .3s}
@media (max-width:1240px) and (min-width:901px){.windbar{width:min(420px,calc(100vw - 640px));left:calc(var(--left) + 290px);transform:none}}
.wind{pointer-events:auto;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;max-width:100%;min-height:50px;padding:6px 20px 6px 8px;text-align:left;
  color:var(--ink);background:radial-gradient(ellipse at 50% 30%,var(--paper) 55%,var(--paper2));border:1px solid var(--gold2);border-radius:6px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--gold-line),0 10px 24px var(--shadow)}
.wind::before,.wind::after{content:'';position:absolute;top:-5px;bottom:-5px;width:9px;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 2px 4px var(--shadow)}
.wind::before{left:-6px} .wind::after{right:-6px}
.wind:hover{border-color:var(--gold)}
.wind[aria-expanded="true"]{box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--gold),0 0 18px var(--gold-glow),0 10px 24px var(--shadow)}
.wind .seal{grid-row:1/3;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 36% 32%,var(--seal-hi) 0 10%,var(--seal) 46%,var(--seal-lo));box-shadow:inset 0 0 0 3px rgba(0,0,0,.16),inset 0 0 0 6px rgba(255,255,255,.08),0 2px 5px var(--shadow)}
.wind.calm .seal{background:radial-gradient(circle at 36% 32%,var(--bead-hi) 0 10%,var(--gold) 46%,var(--gold2))}
.wind .wh{font:700 17px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wind .ws{font:600 12px/1.4 var(--ui);color:var(--k-health);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wind.calm .ws{color:var(--ink-soft)}
.windcard{pointer-events:auto;position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 32px));padding:14px 18px 10px;display:grid;gap:8px;color:var(--ink);
  background:radial-gradient(ellipse at 50% 20%,var(--paper) 55%,var(--paper2));border:1px solid var(--gold2);border-radius:12px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--gold-line),0 18px 40px var(--shadow)}
.windcard h3{margin:0;font:700 17px/1.35 var(--serif);text-align:center}
.windcard dl{margin:0;display:grid;gap:5px}
.windcard dl div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding-top:5px;border-top:1px solid var(--ink-line)}
.windcard dt{font:600 12px/1.55 var(--ui);color:var(--gold2)}
.windcard dd{margin:0;font:13.5px/1.55 var(--serif)}
.windcard [data-k="now"] dd{font-weight:700;color:var(--k-health)}
.wclose{justify-self:center;border:none;background:none;padding:2px 8px;color:var(--ink-soft);font:13px var(--serif);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
/* 오른쪽 위: 해시계 */
.sundial{position:fixed;z-index:5;top:var(--top);right:var(--right);display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;max-width:520px;transition:opacity .3s}
.sundial::before{content:'';order:4;flex-basis:100%;height:0}
.sundial>*{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#bPlay{order:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--glass);border:1.5px solid var(--gold);font-weight:600;box-shadow:0 0 14px var(--gold-glow)}
#bPlay .ic{font-size:18px;color:var(--gold)}
.speeds{order:2;display:flex;align-items:center;gap:2px;height:44px;padding:0 6px 0 12px;border-radius:999px;background:var(--glass);border:1px solid var(--gold-line)}
.speeds>.ic{font-size:20px;color:var(--gold);margin-right:4px}
.speeds button{position:relative;height:34px;padding:0 9px;border:none;border-radius:999px;background:none;font-size:13px;color:var(--paper-dim)}
.speeds button[aria-pressed="true"]{background:var(--paper-faint);color:var(--paper);font-weight:600}
.speeds button[aria-pressed="true"]::after{content:'';position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
#bMore{order:3;width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--gold-line);font-size:20px}
#bMore[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
#bSkip,#bAuto{height:36px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--gold-line);font-size:13px;white-space:nowrap}
#bSkip{order:5} #bAuto{order:6;display:flex;align-items:center;gap:8px}
#bSkip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.sw{position:relative;width:26px;height:15px;border-radius:999px;background:var(--paper-faint);box-shadow:inset 0 0 0 1px var(--paper-line);flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--paper-dim);transition:transform .2s}
#bAuto[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#bAuto[aria-pressed="true"] .sw{background:var(--gold2)} #bAuto[aria-pressed="true"] .sw::after{transform:translateX(11px);background:var(--gold)}
#app .speeds button:hover,#bSkip:hover,#bAuto:hover,#bMore:hover,.menu button:hover{color:var(--paper);border-color:var(--gold)}
#app .speeds button[aria-pressed="true"]:hover{border-color:transparent}
.menu{position:absolute;z-index:2;top:52px;right:0;display:grid;gap:2px;min-width:160px;padding:6px;border-radius:14px;background:var(--glass-deep);border:1px solid var(--gold-line);box-shadow:0 12px 30px var(--shadow)}
.menu button{text-align:left;padding:9px 12px;border-radius:9px;border:1px solid transparent;background:none;font-size:14px}
/* 오른쪽 가운데: 두루마리 */
.scroll{position:fixed;z-index:3;right:calc(var(--right) + 6px);top:calc(var(--top) + 118px);width:300px;max-height:min(50vh,calc(100vh - var(--top) - 118px - 318px));display:flex;flex-direction:column;
  color:var(--ink);background:radial-gradient(ellipse at 50% 30%,var(--paper) 55%,var(--paper2));border:1px solid var(--gold);border-radius:4px;box-shadow:0 14px 34px var(--shadow);transition:opacity .3s}
.scroll::before,.scroll::after{content:'';position:absolute;left:-7px;right:-7px;height:11px;border-radius:6px;background:linear-gradient(var(--gold),var(--gold2));box-shadow:0 2px 4px var(--shadow)}
.scroll::before{top:-7px} .scroll::after{bottom:-7px}
#bScroll{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px 6px;border:none;background:none;color:var(--ink);text-align:left}
#bScroll b{font:700 15px var(--serif);flex:1;display:flex;align-items:center;gap:10px}
#bScroll b::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
#bScroll .st{font-size:11px;color:var(--ink-soft)}
.journal{list-style:none;margin:0;padding:2px 16px 14px;overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--gold2) transparent}
.journal li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--ink-line);font:13.5px/1.6 var(--serif)}
.journal li:first-child{border-top:none}
.journal .ja{color:var(--gold2);font:600 11.5px/1.9 var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.journal .k-birth .jt,.journal .k-death .jt,.journal .k-present .jt{font-weight:700}
.journal .k-stat .jt{color:var(--trace)}
.journal .k-note .jt{font-style:italic;color:var(--gold2)}
.journal .k-tenacity .jt{color:#c86d14;font-weight:600}
.heirloom-card:hover{border-color:var(--gold)!important;background:rgba(226,182,94,.06)!important}
.tri.heirloom .tb{width:auto;height:auto;border-radius:4px;background:transparent;box-shadow:none;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:help;margin-right:2px}
.mk{display:inline-block;width:11px;height:11px;margin:0 6px -1px 0;border-radius:50%;vertical-align:baseline;position:relative}
.mk.star{background:radial-gradient(circle at 50% 55%,var(--c-happy),var(--gold2));box-shadow:0 0 5px var(--gold-glow)}
.mk.star::after{content:'';position:absolute;inset:1px;background:var(--bead-hi);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.mk.crack{background:radial-gradient(circle at 34% 30%,var(--bead-hi) 0 16%,transparent 40%),radial-gradient(circle,var(--c-wealth),var(--gold2))}
.mk.crack::after{content:'';position:absolute;left:1px;right:1px;top:5px;height:1.5px;background:var(--ink);transform:rotate(-24deg)}
/* 모닥불에서 꿴 기억 구슬 (금) · 앞 생의 메아리 (푸름) */
.mk.memo{width:13px;height:13px;margin-bottom:-2px;background:radial-gradient(circle at 34% 30%,var(--bead-hi) 0 16%,transparent 42%),radial-gradient(circle at 50% 60%,var(--c-happy),var(--gold) 55%,var(--gold2));box-shadow:0 0 0 1.5px var(--gold),0 0 7px var(--gold-glow)}
.mk.memo.echo{background:radial-gradient(circle at 34% 30%,var(--bead-hi) 0 16%,transparent 42%),radial-gradient(circle at 50% 58%,var(--trace-l),var(--trace) 72%,var(--ink));box-shadow:0 0 0 1.5px var(--trace-l),0 0 7px var(--trace-l)}
.journal .k-echo .jt{color:var(--trace);font-style:italic}
.scroll:not(.open) .journal{overflow:hidden}
.scroll:not(.open) .journal li:nth-child(n+3){display:none}
.scroll:not(.open) .journal .jt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 오른쪽 아래: 올해의 패 (구슬 실 위) */
.hand{position:fixed;z-index:3;right:var(--right);bottom:calc(122px + var(--bot));display:grid;justify-items:end;gap:2px;transition:opacity .3s}
.hand h3{justify-self:start;margin:0;height:24px;padding:0 11px;border-radius:999px;font:600 12px/24px var(--ui);letter-spacing:.04em;color:var(--gold);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hauto{position:absolute;top:0;right:0;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;background:var(--glass);border:1px solid var(--gold-line)}
.hauto[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--glass-deep)}
.cards{display:flex;gap:8px;align-items:flex-end;padding:14px 2px 2px}
.pcard{--rot:0deg;--ly:0px;position:relative;width:84px;min-height:112px;padding:8px 4px 7px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;gap:2px;
  background:radial-gradient(ellipse at 50% 30%,var(--paper) 50%,var(--paper2));color:var(--ink);border:1px solid var(--ink-line);border-radius:9px;
  box-shadow:0 6px 14px var(--shadow);transform:translateY(var(--ly)) rotate(var(--rot));transform-origin:50% 100%;transition:transform .18s,box-shadow .18s}
.cards .pcard:nth-child(1){--rot:-5deg} .cards .pcard:nth-child(2){--rot:-2.5deg} .cards .pcard:nth-child(4){--rot:2.5deg} .cards .pcard:nth-child(5){--rot:5deg}
.pcard:hover{--ly:-4px}
.pcard>.ic{font-size:24px;color:var(--ink)}
.pcard .pn{font:600 11px/1.2 var(--ui);text-align:center;word-break:keep-all;overflow-wrap:anywhere;max-height:2.4em;overflow:hidden}
.pcard .fxs{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:28px;text-align:center}
.pcard .fx{max-width:100%;font:600 10.5px/1.25 var(--ui);white-space:normal;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}   /* 긴 영어 돈 글은 두 줄까지 */
.pcard[aria-pressed="true"]{--ly:-10px;border:2px solid var(--gold);background:radial-gradient(ellipse at 50% 30%,var(--paper) 40%,var(--c-wealth));box-shadow:0 0 0 1px var(--gold2),0 0 22px var(--gold-glow),0 10px 18px var(--shadow)}
.pcard[aria-pressed="true"]>.ic{color:var(--gold2)}
.baby{margin:6px 0 0;padding:10px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--gold-line);font:14px var(--serif);color:var(--paper-dim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* 구체적인 효과 글 (「은화 +5닢」 · 「마음 −1」): 얻는 것은 초록, 잃는 것은 붉게 */
.fx{display:inline-block;font:700 11px/1.3 var(--ui);white-space:nowrap}
.fx.up{color:var(--up)} .fx.down{color:var(--down)}
/* 아래: 동갑내기 실 + 구슬 실 */
.thread{position:fixed;z-index:4;left:0;right:0;bottom:0;height:calc(120px + var(--bot));padding-bottom:var(--bot);
  background:linear-gradient(to top,var(--glass-deep),var(--glass) 62%,transparent)}
#strand{display:block;width:100%;height:120px;touch-action:pan-y;cursor:grab}
#strand:active{cursor:grabbing}
.tip{position:absolute;z-index:6;width:max-content;max-width:min(300px,calc(100vw - 24px));padding:8px 12px 9px;border-radius:10px;background:var(--paper);color:var(--ink);border:1px solid var(--gold);
  box-shadow:0 10px 24px var(--shadow);font:13px/1.55 var(--serif);pointer-events:none}
.tip b{display:block;font:600 11.5px/1.5 var(--ui);color:var(--gold2)}
.tip p{margin:3px 0 0}
/* 갈림길·모닥불 동안 HUD 를 비킨다 */
#app.calm .sundial,#app.calm .hand,#app.calm .scroll,#app.calm .windbar{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s .3s}
@media (min-width:901px) and (min-height:561px){#app.deciding .thread{z-index:21}}   /* 갈림길 동안에도 구슬 실은 또렷하게 (넓은 화면은 상태 넷도) */
@media (min-width:1180px) and (min-height:561px){#app.deciding .hud-who{z-index:21}}

/* 갈림길 (가운데 종이 카드, 마을은 흐리게) */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(18,19,41,.45)}
#modal.dark{background:var(--night);color:var(--paper)}
#modal.cross{display:flex;overflow-y:auto;padding:60px 16px calc(136px + env(safe-area-inset-bottom,0px));background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.xcard:focus,.ccard:focus{outline:none}
.xcard{--p:0%;position:relative;margin:auto;width:100%;max-width:580px;padding:46px 30px 18px;display:grid;gap:10px;color:var(--ink);
  background:radial-gradient(ellipse at 50% 20%,var(--paper) 55%,var(--paper2));border:1px solid var(--gold2);border-radius:14px;
  box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--gold-line),0 26px 60px var(--shadow)}
.xcard::after{content:'';position:absolute;inset:-4px;padding:3px;border-radius:17px;pointer-events:none;opacity:0;transition:opacity .2s;
  background:conic-gradient(var(--gold) 0 var(--p),transparent var(--p) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 6px var(--gold-glow))}
.xcard.waiting::after{opacity:1}
.emblem{position:absolute;top:-36px;left:50%;width:72px;height:72px;margin-left:-36px;border-radius:50%;display:grid;place-items:center;font-size:36px;color:var(--gold);
  background:radial-gradient(circle at 50% 40%,var(--ink),var(--night));border:2px solid var(--gold);box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--gold2),0 8px 20px var(--shadow)}
.xwhen{margin:0;text-align:center;font:14px var(--serif);color:var(--ink-soft)}
.xcard h3{margin:0;text-align:center;font:700 25px/1.35 var(--serif);text-wrap:balance}
.orn{position:relative;height:9px;margin:2px auto;width:min(240px,70%);background:linear-gradient(90deg,transparent,var(--gold2) 30%,transparent 45%,transparent 55%,var(--gold2) 70%,transparent) center/100% 1px no-repeat}
.orn::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--gold2);transform:rotate(45deg)}
.xtext{margin:0;text-align:center;font:16px/1.75 var(--serif);text-wrap:pretty}
.xnote{margin:0;padding:7px 12px;border-left:3px solid var(--trace);background:var(--paper-hi);font-size:12.5px;color:var(--ink-soft);border-radius:0 8px 8px 0}
.xtrace{margin:0;display:flex;justify-content:center;align-items:center;gap:8px;font-size:12.5px;color:var(--trace);font-weight:600}
.xtrace .trace-bead{position:static;transform:none}
.paths{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.path{position:relative;width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:9px 14px 9px 10px;min-height:58px;
  border-radius:14px;border:1px solid var(--ink-line);background:var(--paper-hi);color:var(--ink);box-shadow:0 1px 0 var(--paper-hi) inset,0 2px 6px rgba(29,33,64,.06);transition:border-color .15s,background .15s,transform .15s}
.path:hover,.path:focus-visible{border-color:var(--gold2);background:var(--paper);transform:translateY(-1px)}
.path:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.path .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--serif);color:var(--gold);
  background:radial-gradient(circle at 50% 40%,var(--ink),var(--night));box-shadow:0 0 0 2px var(--gold-line)}
.path .pt{font:15.5px/1.5 var(--serif)}
.path .pfx{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px 10px;max-width:220px}
.path .fx{font-size:13px}
.luck{font:600 11px/1 var(--ui);color:var(--ink-soft);border:1px dashed var(--ink-soft);border-radius:999px;padding:3px 8px;white-space:nowrap}
.path.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px var(--gold-glow)}
/* 잠긴 길 (choice.when): 흐리고 빗금, 까닭을 단다. 누를 수 없다 */
.path.locked{cursor:not-allowed;border-style:dashed;color:var(--ink-soft);background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(29,33,64,.05) 9px 18px),var(--paper-hi);box-shadow:none}
.path.locked:hover,.path.locked:focus-visible{transform:none;border-color:var(--ink-soft);background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(29,33,64,.05) 9px 18px),var(--paper-hi)}
.path.locked .num{color:var(--paper-dim);background:var(--ink-soft);box-shadow:none}
.path.locked .pt{opacity:.75}
.lock{display:inline-flex;align-items:center;gap:5px;font:600 12px/1.3 var(--ui);color:var(--ink-soft);white-space:nowrap}
.lock .ic{font-size:13px}
.trace-bead{position:absolute;left:-8px;top:50%;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--bead-hi) 0 16%,transparent 42%),radial-gradient(circle at 50% 58%,var(--trace-l),var(--trace) 72%,var(--ink));box-shadow:0 0 9px var(--trace-l)}
.xfoot{display:grid;place-items:center;min-height:34px;margin-top:2px}   /* 맡기기 단추와 기다림 글이 한 자리를 나눠 쓴다 (카드 높이가 튀지 않게) */
.xfoot>*{grid-area:1/1}
.xline{margin:0;text-align:center;font:600 12.5px var(--ui);color:var(--gold2)}
.xauto{justify-self:center;border:none;background:none;padding:4px 6px;color:var(--ink);font:15px var(--serif);text-decoration:underline;text-decoration-color:var(--gold2);text-underline-offset:5px;cursor:pointer}
/* 모닥불: 기억 구슬 고르기 + 앞 생의 메아리 (오른쪽 종이 판, 폰은 아래 시트. 시안 29 s8a·s8b) */
#modal.camp{display:flex;justify-content:flex-end;overflow-y:auto;padding:52px calc(40px + env(safe-area-inset-right,0px)) calc(132px + env(safe-area-inset-bottom,0px)) 24px;background:linear-gradient(90deg,transparent 40%,var(--night-fade))}
.ccard{--p:0%;position:relative;margin:auto 0;width:min(440px,44vw);padding:46px 24px 16px;display:grid;gap:12px;color:var(--ink);
  background:radial-gradient(ellipse at 50% 20%,var(--paper) 55%,var(--paper2));border:1px solid var(--gold2);border-radius:14px;box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--gold-line),0 26px 60px var(--shadow)}
.ccard .emblem{top:-31px;width:62px;height:62px;margin-left:-31px;font-size:30px}
.ct{margin:0 -4px;padding:9px 14px;text-align:center;font:700 23px/1.3 var(--serif);color:var(--ink);text-wrap:balance;
  background:linear-gradient(var(--c-wealth),var(--gold));border:1px solid var(--gold2);border-radius:6px;box-shadow:inset 0 0 0 3px var(--paper-hi),0 3px 8px var(--shadow)}
.mems{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:10px}
.cbead{position:relative;width:100%;display:grid;grid-template-columns:46px minmax(0,1fr);grid-template-rows:auto auto;column-gap:14px;row-gap:1px;align-items:center;padding:11px 16px 11px 11px;text-align:left;
  border-radius:22px;border:1px solid var(--ink-line);background:var(--paper-hi);color:var(--ink);box-shadow:0 1px 0 var(--paper-hi) inset,0 2px 6px rgba(29,33,64,.08);transition:border-color .15s,transform .15s,box-shadow .15s,opacity .25s}
.cbead:hover,.cbead:focus-visible{border-color:var(--gold2);transform:translateY(-1px);box-shadow:0 0 0 1px var(--gold2),0 6px 14px rgba(29,33,64,.12)}
.cbead:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.orb{grid-row:1/3;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--ink);
  background:radial-gradient(circle at 34% 28%,var(--bead-hi) 0 12%,transparent 38%),radial-gradient(circle at 50% 62%,var(--paper) 0 18%,var(--c-happy) 58%,var(--gold2));box-shadow:inset 0 0 0 1.5px var(--gold2),0 0 12px var(--gold-glow)}
.orb .ic{opacity:.82}
.cbt{font:700 16.5px/1.4 var(--serif);text-wrap:pretty}
.cbm{font:12.5px/1.4 var(--ui);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cbead.echo{background:linear-gradient(var(--paper-hi),transparent),var(--trace-bg);border-color:var(--trace-l)}
.cbead.echo .orb{color:var(--paper);background:radial-gradient(circle at 34% 28%,var(--bead-hi) 0 12%,transparent 38%),radial-gradient(circle at 50% 60%,var(--trace-l),var(--trace) 70%,var(--ink));box-shadow:inset 0 0 0 1.5px var(--trace),0 0 14px var(--trace-l)}
.cbead.echo .orb .ic{opacity:1;filter:drop-shadow(0 0 1.5px var(--ink)) drop-shadow(0 0 4px var(--trace))}
.cbead.echo .cbm{color:var(--trace);font-weight:600}
.cbead.echo:hover,.cbead.echo:focus-visible{border-color:var(--trace);box-shadow:0 0 0 1px var(--trace),0 6px 14px rgba(29,33,64,.12)}
/* 저절로 꿰어질 구슬: 둘레에 금빛이 차오른다 (--p) */
.cbead.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px var(--gold-glow)}
.cbead.next .orb::after{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--gold) 0 var(--p),transparent var(--p) 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));filter:drop-shadow(0 0 4px var(--gold-glow))}
.ccard.done .cbead{pointer-events:none}
.ccard.done .cbead:not(.picked){opacity:.4}
.cbead.picked{border-color:var(--gold);transform:scale(1.02);box-shadow:0 0 0 2px var(--gold),0 0 26px var(--gold-glow)}
.cbead.echo.picked{border-color:var(--trace);box-shadow:0 0 0 2px var(--trace-l),0 0 26px var(--trace-l)}
.cbead.picked .orb{animation:orbPick .5s ease-out both}
@keyframes orbPick{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1.1)}}
.chint{margin:2px 0 0;text-align:center;font:13px/1.6 var(--serif);color:var(--ink-soft);text-wrap:balance}
.chint .eh{display:block;color:var(--trace)}
.cline{margin:-4px 0 0;min-height:1.5em;text-align:center;font:600 12px/1.5 var(--ui);color:var(--k-wealth)}

.btns{display:grid;gap:10px;max-width:420px}
.btns.row{display:flex;flex-wrap:wrap;max-width:none}
.last{display:grid;gap:10px;text-align:center;max-width:560px}
.last h2{font:700 36px/1.2 var(--serif);margin:0}
.last .ghost{position:fixed;inset:0;opacity:0}
#loadfail{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--night);color:var(--paper);text-align:center}
#loadfail div{max-width:460px;display:grid;gap:12px;justify-items:center}
#loadfail p{margin:0;font:16px/1.7 var(--serif)} #loadfail small{opacity:.7}
/* 서류와 시작·족보 화면 (작업 6 이 다시 그린다) */
.peers{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.lmap{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.lmap i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.lmap i.on{background:rgba(168,119,10,var(--o))}
.lmap i.e0{outline:2px solid var(--ink);outline-offset:-2px}
.doc .lmap{max-width:420px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:12px 0}
.fields div{min-width:0} .fields dt{font-size:12px;color:var(--muted)} .fields dd{margin:0;font-weight:600}
.fields.sm{grid-template-columns:1fr 1fr;gap:6px 10px;margin:0}
#screen{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#screen.night{background:var(--night);color:var(--paper)}
.doc{width:100%;max-width:800px;flex:0 0 auto;box-sizing:border-box;margin:0 auto 24px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 36px var(--shadow)}
.doc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 22px;background:var(--ink);color:var(--gold);font-weight:600}
.doc-head .head-actions{display:flex;align-items:center;gap:10px}
.doc-head button.quick-act{font:600 12.5px/1 var(--ui);color:var(--gold);background:rgba(226,182,94,.12);border:1px solid var(--gold);border-radius:999px;padding:5px 12px;min-height:26px;cursor:pointer;transition:all .15s ease}
.doc-head button.quick-act:hover{background:var(--gold);color:#121329}
.doc.death .doc-head{background:#0d0e1f}
.doc-body{padding:18px 24px 22px;display:grid;gap:12px}
.doc .peers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 14px;font-size:12.5px}
.doc .btns{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:none;margin-top:4px}
.doc .btns button.primary{width:100%;max-width:540px;min-height:48px;font:700 16px/1.2 var(--serif);letter-spacing:.04em;background:linear-gradient(135deg,var(--ink),#2c325e);border:1.5px solid var(--gold);color:var(--gold);border-radius:12px;box-shadow:0 4px 18px rgba(226,182,94,.22);transition:all .2s ease}
.doc .btns button.primary:hover{transform:translateY(-1px);background:linear-gradient(135deg,#242a54,#384078);box-shadow:0 6px 24px rgba(226,182,94,.42);color:#fff}
.hint-kbd{font-size:11.5px;color:var(--muted);margin-top:2px}
.doc h2{font:700 24px/1.35 var(--serif);margin:0;text-wrap:balance}
.doc .obit{font:16px/1.8 var(--serif);margin:0}
.doc .common{margin:0;padding:8px 12px;border-left:3px solid var(--gold2);background:var(--bg);font:14.5px/1.7 var(--serif);border-radius:0 8px 8px 0}
.doc .common b{display:block;font:600 12px/1.6 var(--ui);color:var(--gold2)}
.doc .quote{font-family:var(--serif);font-style:italic;margin:0}
.doc textarea{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.eyebrow{color:var(--gold2);letter-spacing:.06em;font-size:12px;font-weight:600;margin:0}
.sheet{width:100%;max-width:680px;flex:0 0 auto;box-sizing:border-box;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.sheet h1{font:700 clamp(32px,5.5vw,48px)/1.2 var(--serif);margin:0;text-wrap:balance}
.sheet .lead{margin:0;display:grid;gap:4px;font:15.5px/1.7 var(--serif);max-width:560px}
.sheet .btns{display:grid;gap:10px;width:100%;max-width:440px;margin:0 auto}
.sheet .btns button.primary{min-height:50px;font:700 17px var(--serif);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#121329;border:none;border-radius:12px;box-shadow:0 4px 18px var(--gold-glow);transition:all .2s ease}
.sheet .btns button.primary:hover{transform:translateY(-1px);box-shadow:0 6px 26px var(--gold-glow)}
.sheet .btns.row{display:flex;justify-content:center;gap:8px;max-width:none}
.night button:not(.primary){background:transparent;color:var(--paper);border-color:rgba(246,239,226,.5)}
.night button.primary{background:var(--gold);border-color:var(--gold);color:#241c08}
.night .eyebrow{color:var(--gold)}
.credit{font-size:12px;opacity:.75;max-width:62ch}
.surv{width:100%;max-width:420px;height:auto;color:var(--ink)}
.lives{display:grid;gap:14px;position:relative;padding-left:22px}
.lives::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--gold)}
.life{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:center;position:relative}
.life::before{content:'';position:absolute;left:-20px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);transform:translateY(-50%)}
.life img{width:160px;border-radius:8px;display:block}
/* 운명의 제단 (Altar of Destiny) */
.ember-pip{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold-glow);transition:all .2s ease}
.ember-pip.empty{background:var(--line);box-shadow:none;transform:scale(0.85);opacity:0.5}
.btn-preset:hover{border-color:var(--gold2)!important;color:var(--gold2)!important;background:rgba(226,182,94,.08)!important}
.stepper-btn:hover:not(:disabled){background:var(--gold)!important;color:#121329!important;border-color:var(--gold)!important}
.stepper-btn:disabled{opacity:0.3;cursor:not-allowed!important}
/* 족보 위 영혼의 염주: 생마다 실 한 가닥, 모닥불에서 꿴 기억 구슬은 크게. 메달은 그 생의 마을 그림 (없으면 땅 이름) */
.rosary-box{position:relative;width:100%;aspect-ratio:2.35;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--gold-line),0 8px 24px var(--shadow)}
.rosary-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lmem{font:14px/1.6 var(--serif);color:var(--c-wealth)}
.dex{overflow-x:auto} .dex table{border-collapse:collapse;font-size:12px}
.dex td,.dex th{border:1px solid rgba(255,255,255,.15);padding:4px 6px;text-align:center;min-width:44px}
.dex td.on{background:var(--gold);color:#241c08;font-weight:600}
#intro{position:fixed;inset:0;z-index:30;background:var(--night);transition:opacity .8s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro.atlas{background:#e9dcc0}
#intro.atlas .it{box-shadow:0 8px 26px rgba(29,33,64,.28);border:1px solid var(--gold2)}
#intro .eyebrow{font:600 12px/1.3 var(--ui);letter-spacing:.06em;color:var(--gold2)}
#intro .it{position:absolute;left:50%;bottom:calc(10% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,92vw);text-align:center;display:grid;gap:8px;background:rgba(246,239,226,.95);color:var(--ink);border-radius:14px;padding:16px 18px;transition:opacity .6s}
#intro .big{font:700 30px/1.2 var(--serif)} #intro .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
#toast{position:fixed;z-index:40;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px}
/* 처음 하는 사람을 위한 다듬기 (클라우드 2026-10-21): 시작 전 로딩 · 무대 짓는 중 · 첫 화면 세 줄 · 설정 · 3단계 안내 */
#boot{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:var(--night);color:var(--paper);font:15px/1.6 var(--serif)}
#boot div{display:grid;gap:14px;justify-items:center}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--gold-line,rgba(226,182,94,.35));border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stageload{position:absolute;z-index:3;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);margin:0;display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 10px;border-radius:999px;background:var(--glass-deep);border:1px solid var(--gold-line,rgba(226,182,94,.35));color:var(--paper);font:600 13px/1.3 var(--ui);pointer-events:none}
.stageload .spin{width:16px;height:16px;border-width:2px}
.sheet .lead{margin:0;display:grid;gap:4px;font:17px/1.65 var(--serif)}
.sheet .lead span{display:block}
.setsheet{max-width:460px;width:100%;display:grid;gap:16px;padding:22px 22px 18px;border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:0 10px 30px var(--shadow)}
.setsheet h2{margin:0;font:700 24px/1.2 var(--serif)}
.setsheet .row{display:grid;gap:6px}
.setsheet .row > b{font:600 13px/1.3 var(--ui);color:var(--muted)}
.setsheet .seg{display:flex;flex-wrap:wrap;gap:6px}
.setsheet .seg button{flex:1 1 auto}
.setsheet small{color:var(--muted);font-size:12px;line-height:1.5}
#coach{position:fixed;inset:0;z-index:26}
#coach .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 2px var(--gold),0 0 0 9999px rgba(18,19,41,.66);transition:all .35s ease;pointer-events:none}
#coach .bub{position:fixed;width:min(380px,calc(100vw - 32px));display:grid;gap:10px;padding:16px 18px 14px;border-radius:14px;background:var(--paper);color:var(--ink);
  box-shadow:0 10px 30px var(--shadow);border:1px solid var(--gold2);transition:top .35s ease,left .35s ease}
#coach .bub h3{margin:0;font:700 19px/1.3 var(--serif)}
#coach .bub p{margin:0;font:14.5px/1.65 var(--serif)}
#coach .bub .nav{display:flex;align-items:center;gap:8px}
#coach .bub .nav .n{margin-right:auto;font:600 12px/1 var(--ui);color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  #intro,#intro .it{transition:none}
  .pcard,.path,.hud-who,.sundial,.scroll,.hand,.sw::after,.xcard::after,.cbead{transition:none}
  .cbead.picked .orb{animation:none}
  .traces.pulse .tri.deep .tb,.traces.pulse .tri.deep .tlv i.on{animation:none}
  .delta{display:none}
  .num.glow{animation:none}
  .stats .bar i{transition:none}
  .windbar{transition:none}
}

/* 폰 (≤ 900px, 또는 높이 ≤ 560px 인 가로 폰): 마을(40svh) → 상태 넷 → 구슬 실 → 올해의 패 → 두루마리 시트. 배지와 해시계 단추는 마을 위에 뜬다 */
@media (max-width:900px),(max-height:560px){
  body{overflow:auto}
  body:has(#app:not([hidden])){background:var(--night)}
  #app{--pad:12px;position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(5,auto);align-content:space-between;   /* 남는 높이는 칸 사이에 고르게 */
    grid-template-areas:"stage" "wind" "stats" "thread" "hand" "scroll";grid-template-rows:repeat(6,auto);min-height:100vh;min-height:100svh;background:var(--night)}
  .hud-who{display:contents}
  .stage{grid-area:stage;position:relative;inset:auto;height:40vh;height:40svh;min-height:220px;overflow:hidden}
  .stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(transparent,var(--night));pointer-events:none}
  .soulbadge{grid-area:stage;align-self:start;justify-self:start;z-index:3;margin:var(--top) 0 0 var(--left);grid-template-columns:43px auto 1fr;row-gap:3px;column-gap:0;max-width:calc(100vw - 140px);
    padding:6px 14px 6px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--gold-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px var(--shadow)}
  .medal{grid-row:1/3;width:34px;height:34px;font-size:18px;border-width:1.5px;box-shadow:0 0 12px var(--gold-glow)}
  .lifen{font:600 14px/1 var(--ui);color:var(--paper);letter-spacing:0}
  .lifen::after{content:'·';margin:0 6px;color:var(--gold)}
  #age{font:600 15px/1 var(--ui);text-shadow:none}
  .agebox{gap:1px} .agebox span{font:600 14px/1 var(--ui);color:var(--paper)}
  .lifen{grid-area:1/2} .agebox{grid-area:1/3}
  .when{grid-area:2/2/3/4;margin:0;padding:0;border:none;font-size:11px;line-height:1.3}
  .traces{grid-area:stage;align-self:end;justify-self:start;z-index:3;margin:0 0 14px var(--left);padding:4px 10px 4px 8px;border-radius:999px;background:var(--glass)}
  .board{grid-area:stats;margin:0;padding:6px var(--left) 2px;border:none;gap:6px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .stats li{grid-template-columns:minmax(0,1fr);grid-template-areas:"ic" "num" "bar" "lbl";justify-items:center;row-gap:2px}
  .stats li .ic{align-self:center;margin:0;font-size:20px}
  .stats .bar{width:72%;height:5px}
  .stats .lbl{font-size:12px}
  .stats .cl{display:none}
  .windbar{grid-area:wind;position:relative;z-index:7;top:auto;left:auto;right:auto;padding:6px var(--left) 0}
  .wind{width:100%;min-height:0;padding:5px 14px 5px 6px;column-gap:8px}
  .wind .seal{width:24px;height:24px}
  .wind .wh{font-size:14.5px} .wind .ws{font-size:11px}
  .windcard{left:var(--left);right:var(--right);width:auto;transform:none;top:calc(100% + 6px)}
  .sundial{position:absolute;top:var(--top);right:var(--right);z-index:6;max-width:calc(100vw - 2 * var(--right));gap:6px;padding:0;border-radius:20px}
  .sundial::before{display:none}
  #bPlay{order:1;width:44px;height:44px;padding:0;justify-content:center;border-radius:50%}
  #bPlay .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #bMore{order:2}
  .sundial:not(.open) .speeds,.sundial:not(.open) #bSkip,.sundial:not(.open) #bAuto{display:none}
  .sundial.open{width:min(320px,calc(100vw - 2 * var(--right)));padding:8px;background:var(--glass-deep);border:1px solid var(--gold-line);box-shadow:0 14px 34px var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .sundial.open>*{-webkit-backdrop-filter:none;backdrop-filter:none}
  .sundial.open .speeds{order:3;flex-basis:100%;display:grid;grid-template-columns:auto repeat(4,1fr);padding:0 4px 0 10px}
  .sundial.open .speeds button{padding:0 4px;font-size:12.5px;white-space:nowrap}
  .sundial.open #bSkip{order:4;flex:1 1 100%;height:42px}
  .sundial.open #bAuto{order:5;flex:1 1 100%;height:42px;justify-content:center}
  .menu{position:static;order:6;flex-basis:100%;grid-template-columns:repeat(3,1fr);min-width:0;padding:4px 0 0;background:none;border:none;border-top:1px solid var(--gold-line);border-radius:0;box-shadow:none}
  .menu button{text-align:center;padding:10px 4px;font-size:13px}
  .thread{grid-area:thread;position:relative;height:96px;padding:0;background:none;z-index:1}
  #strand{height:96px}
  .hand{grid-area:hand;position:relative;right:auto;bottom:auto;justify-items:stretch;padding:0 var(--left) 12px var(--left);gap:0}
  .hand h3{line-height:28px}
  .hauto{top:2px;right:var(--right)}
  .cards{justify-content:space-between;gap:0;padding:10px 0 0}
  .cards .pcard:nth-child(n){--rot:0deg}
  .pcard{width:19%;height:auto;min-height:96px;padding:8px 2px 6px;border-radius:10px}
  .pcard .fx{font-size:10px}
  .pcard[aria-pressed="true"]{--ly:-6px}
  .pcard .pn{font-size:11.5px}
  .baby{justify-self:start}
  .scroll{grid-area:scroll;align-self:end;position:sticky;z-index:5;bottom:0;right:auto;top:auto;width:auto;max-height:96px;margin:4px 0 0;
    border-radius:18px 18px 0 0;border-width:1px 0 0;padding-bottom:var(--bot);box-shadow:0 -10px 26px var(--shadow)}
  .scroll::before{left:50%;right:auto;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--ink-line);box-shadow:none}
  .scroll::after{display:none}
  #bScroll{padding:16px 16px 2px}
  .scroll.open{position:fixed;left:0;right:0;max-height:60vh;max-height:60svh;z-index:15}
  .journal{padding:0 16px 10px}
  .journal li{padding:4px 0}
  .scroll:not(.open) .journal li{padding:3px 0}
  #modal.cross{padding:52px 10px calc(14px + env(safe-area-inset-bottom,0px))}
  .xcard{padding:44px 16px 14px;gap:8px}
  .xcard h3{font-size:21px}
  .xtext{font-size:15px}
  .path{grid-template-columns:32px minmax(0,1fr);padding:9px 12px 9px 9px;gap:4px 10px}
  .path .num{width:32px;height:32px;font-size:14px;grid-row:span 2}
  .path .pfx{grid-column:2;justify-content:flex-start;max-width:none}
  #modal.camp{align-items:flex-end;justify-content:stretch;padding:0;background:linear-gradient(transparent 35%,var(--night-fade))}
  .ccard{width:100%;margin:0;max-height:62vh;max-height:62svh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(12px + env(safe-area-inset-bottom,0px));gap:9px}
  .ccard .emblem{display:none}
  .ct{margin:0;font-size:19px;padding:7px 10px}
  .mems{gap:8px}
  .cbead{grid-template-columns:40px minmax(0,1fr);column-gap:11px;padding:9px 12px 9px 9px;border-radius:18px}
  .orb{width:40px;height:40px;font-size:19px}
  .cbt{font-size:15px}
  .life{grid-template-columns:110px 1fr}.life img{width:110px}
}
</style>
</head>

<script>
// three.js(CDN)를 못 받으면 모듈 전체가 시작하지 못해 빈 화면이 된다. 모듈 스크립트가 실패하거나 20초 안에 시작하지 않으면 (느린 폰 망에서 한 파일 공유본은 1 MB 넘게 받는다) (window.__pl 없음) 안내를 띄운다.
// 늦게라도 시작하면 안내를 거둔다. 모듈이 아닌 보통 스크립트라서 three 가 없어도 돈다
(function () {
  var box = null;
  function lang() {
    var l = null;
    try { l = JSON.parse(localStorage.getItem('pl.lang')); } catch (e) { l = null; }
    if (l !== 'ko' && l !== 'en') l = (navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
    return l;
  }
  function show() {
    if (box || window.__pl) return;
    var ko = '게임을 불러오지 못하고 있어요. 인터넷 연결을 확인하고 다시 불러와 주세요.';
    var en = 'The game could not load. Please check your internet connection and reload.';
    var first = lang() === 'ko';
    box = document.createElement('div');
    box.id = 'loadfail'; box.className = 'night';
    box.setAttribute('role', 'alert');
    var inner = document.createElement('div');
    var p = document.createElement('p'); p.textContent = first ? ko : en;
    var s = document.createElement('small'); s.textContent = first ? en : ko;
    var b = document.createElement('button'); b.className = 'primary'; b.textContent = first ? '다시 불러오기 · Reload' : 'Reload · 다시 불러오기';
    b.onclick = function () { location.reload(); };
    inner.appendChild(p); inner.appendChild(s); inner.appendChild(b); box.appendChild(inner);
    var boot = document.getElementById('boot'); if (boot) boot.remove();
    document.body.appendChild(box);
    var t = setInterval(function () { if (window.__pl) { clearInterval(t); box.remove(); } }, 500);
  }
  window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') show(); }, true);
  setTimeout(show, 20000);
})();
</script>
<script type="module" src="./main.js"></script>
